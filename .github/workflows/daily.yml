name: Daily AI news
on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Asia/Bangkok
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Bangkok
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/news.db
          key: newsdb-${{ github.run_id }}
          restore-keys: newsdb-
      - run: python update_news.py
      - name: Claude morning brief
        run: python summarize.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python build_static.py
      - name: Record last run (keeps the scheduled workflow active)
        run: |
          tail -n 1 data/update.log > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Daily news update" || echo "nothing to commit"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
