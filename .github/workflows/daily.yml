name: Daily AI news
on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Asia/Bangkok
  workflow_dispatch:
  push:   # the Claude Code routine pushes the morning brief; rebuild so it shows on the site
    branches: [main]
    paths: ["brief/summary.json"]
permissions:
  contents: read
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Bangkok
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      # The routine reads untrusted news text, so a push it makes may only touch the brief.
      - name: Reject pushes that change anything but brief/summary.json
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::This push has no previous commit to compare with, so it can't be checked. Not building."
            exit 1
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          if [ "$changed" != "brief/summary.json" ]; then
            echo "::error::A push may change only brief/summary.json. Not building. This push changed:"
            echo "$changed" | sed 's/^/- /'
            exit 1
          fi
          size=$(stat -c %s brief/summary.json)
          if [ "$size" -gt 65536 ]; then
            echo "::error::brief/summary.json is $size bytes. The limit is 64 KB. Not building."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/news.db
          key: newsdb-${{ github.run_id }}
          restore-keys: newsdb-
      - run: python update_news.py
      - run: python export_brief_input.py
      - name: Commit brief input (also keeps the scheduled workflow active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief/articles.json
          git commit -m "Daily news update" || echo "nothing to commit"
          git pull --rebase -q origin main
          git push
      - run: python build_static.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Reads the Pages API, which needs a pages permission that the build job doesn't have.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
