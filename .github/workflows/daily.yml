name: Daily AI news
on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Asia/Bangkok
  workflow_dispatch:
  push:   # the Claude Code routine pushes the morning brief; rebuild so it shows on the site
    branches: [main]
    paths: ["brief/summary.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Bangkok
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/news.db
          key: newsdb-${{ github.run_id }}
          restore-keys: newsdb-
      - run: python update_news.py
      - run: python export_brief_input.py
      - name: Commit brief input (also keeps the scheduled workflow active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief/articles.json
          git commit -m "Daily news update" || echo "nothing to commit"
          git pull --rebase -q origin main
          git push
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
